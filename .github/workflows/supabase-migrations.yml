# Checks migrations on pull requests and applies them to the production
# Supabase project when they reach main. Needs the SUPABASE_ACCESS_TOKEN secret
# (and SUPABASE_DB_PASSWORD if set); see docs/DEVELOPMENT.md.
name: Supabase migrations

on:
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-migrations.yml"
      - ".github/scripts/check-migration-versions.sh"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  SUPABASE_CLI_VERSION: 2.118.0
  SUPABASE_PROJECT_ID: sejfkcrmcbsiidftraek

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Migration versions are unique and new ones sort last
        run: .github/scripts/check-migration-versions.sh "${{ github.event.pull_request.base.sha }}"

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Apply every migration to a fresh local database
        run: supabase db start

      - name: Lint the schema
        run: supabase db lint --level warning --fail-on error

      # Shows exactly what main would apply; skipped where secrets are absent (forks).
      - name: Dry run against production
        if: github.event_name == 'pull_request' && env.HAS_TOKEN == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -n "$DB_PASSWORD" ]; then export SUPABASE_DB_PASSWORD="$DB_PASSWORD"; fi
          supabase link --project-ref "$SUPABASE_PROJECT_ID"
          supabase db push --dry-run

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: supabase-production
      cancel-in-progress: false
    env:
      HAS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require the access token
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::Add the SUPABASE_ACCESS_TOKEN secret (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      # Secrets live only on the steps that use them, never on third-party actions.
      - name: Apply new migrations to production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -n "$DB_PASSWORD" ]; then export SUPABASE_DB_PASSWORD="$DB_PASSWORD"; fi
          supabase link --project-ref "$SUPABASE_PROJECT_ID"
          supabase db push --dry-run
          supabase db push --yes
          supabase migration list
